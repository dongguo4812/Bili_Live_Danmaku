<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live2D MOC3 Runtime</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent !important;
    }
    body { position: relative; background-color: transparent !important; }
    canvas { background-color: transparent !important; }
    body > canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: transparent;
    }
    #moc3-panel-toggle, #moc3-tts-panel, #live2d-bubble { display: none !important; }
  </style>
  <script>
    // The parent page chooses the model; do not restore a stale model from the sample app's localStorage.
    try { localStorage.removeItem("live2d_moc3_selected_model_v1"); } catch (_) {}
    const modelParams = new URLSearchParams(window.location.search);
    modelParams.set("model", {{ model_url|tojson }});
    window.history.replaceState(null, "", window.location.pathname + "?" + modelParams.toString());
  </script>
  <script>
    // Forward model-resource failures to the parent display page instead of leaving it
    // waiting for the model-loaded signal until its 45-second timeout.
    window.__moc3ModelUrl = {{ model_url|tojson }};
    (() => {
      const isModelResource = value => {
        try {
          const url = new URL(value, window.location.href);
          return url.origin === window.location.origin && url.pathname.startsWith("/models/moc3/");
        } catch (_) {
          return false;
        }
      };
      const reportFailure = (resource, message) => {
        if (!isModelResource(resource) || window.parent === window) return;
        window.parent.postMessage({
          type: "moc3-model-error",
          modelUrl: window.__moc3ModelUrl,
          resource: new URL(resource, window.location.href).pathname,
          message: String(message || "模型资源加载失败").slice(0, 300)
        }, window.location.origin);
      };

      const originalFetch = window.fetch.bind(window);
      window.fetch = async (...args) => {
        const requestUrl = typeof args[0] === "string" ? args[0] : args[0]?.url;
        try {
          const response = await originalFetch(...args);
          if (!response.ok && isModelResource(requestUrl)) {
            reportFailure(requestUrl, "HTTP " + response.status + " " + response.statusText);
          }
          return response;
        } catch (error) {
          reportFailure(requestUrl, error && error.message ? error.message : "网络请求失败");
          throw error;
        }
      };

      // Cubism's texture manager only registers an image load callback. Capture
      // image errors here so a missing/invalid texture also fails promptly.
      window.addEventListener("error", event => {
        const target = event.target;
        if (target instanceof HTMLImageElement) {
          reportFailure(target.currentSrc || target.src, "纹理图片加载失败或无法解码");
        }
      }, true);
    })();
  </script>
  <script>
    // Read-only transparency diagnostics across every same-origin iframe boundary.
    // This does not change styles, WebGL state, or rendering behavior.
    (() => {
      const summarize = (el, win) => {
        if (!el) return null;
        const cs = win.getComputedStyle(el);
        const rect = el.getBoundingClientRect();
        const pseudo = pseudoName => {
          const ps = win.getComputedStyle(el, pseudoName);
          return {
            content: ps.content,
            backgroundColor: ps.backgroundColor,
            backgroundImage: ps.backgroundImage,
            opacity: ps.opacity,
            display: ps.display
          };
        };
        return {
          node: el.tagName.toLowerCase(),
          id: el.id || "",
          className: typeof el.className === "string" ? el.className : "",
          rect: {
            x: Math.round(rect.x * 10) / 10,
            y: Math.round(rect.y * 10) / 10,
            width: Math.round(rect.width * 10) / 10,
            height: Math.round(rect.height * 10) / 10
          },
          backgroundColor: cs.backgroundColor,
          backgroundImage: cs.backgroundImage,
          opacity: cs.opacity,
          filter: cs.filter,
          backdropFilter: cs.backdropFilter || cs.webkitBackdropFilter || "none",
          mixBlendMode: cs.mixBlendMode,
          isolation: cs.isolation,
          transform: cs.transform,
          position: cs.position,
          zIndex: cs.zIndex,
          display: cs.display,
          visibility: cs.visibility,
          before: pseudo("::before"),
          after: pseudo("::after")
        };
      };

      const run = () => {
        const result = {
          type: "moc3-transparency-dom-diagnostic",
          timestamp: new Date().toISOString(),
          location: location.href,
          dpr: window.devicePixelRatio,
          viewport: { width: innerWidth, height: innerHeight },
          levels: []
        };
        let current = window;
        for (let level = 0; level < 5 && current; level++) {
          let doc;
          try { doc = current.document; } catch (error) {
            result.levels.push({ level, access: "blocked", error: String(error) });
            break;
          }
          const levelInfo = {
            level,
            url: current.location.href,
            viewport: { width: current.innerWidth, height: current.innerHeight },
            html: summarize(doc.documentElement, current),
            body: summarize(doc.body, current),
            canvas: level === 0 ? summarize(doc.querySelector("canvas"), current) : null
          };
          if (level > 0) {
            try {
              const frame = current.frameElement;
              levelInfo.frameInParent = summarize(frame, current.parent);
              if (frame) {
                const parentDoc = current.parent.document;
                const ancestors = [];
                for (let el = frame.parentElement; el && ancestors.length < 12; el = el.parentElement) {
                  ancestors.push(summarize(el, current.parent));
                }
                levelInfo.frameAncestors = ancestors;
                const r = frame.getBoundingClientRect();
                const probes = [
                  ["top-left", r.left + 2, r.top + 2],
                  ["top-right", r.right - 2, r.top + 2],
                  ["center", r.left + r.width / 2, r.top + r.height / 2],
                  ["bottom-left", r.left + 2, r.bottom - 2],
                  ["bottom-right", r.right - 2, r.bottom - 2]
                ];
                levelInfo.parentHitTests = probes.map(([name, x, y]) => ({
                  point: name,
                  stack: current.parent.document.elementsFromPoint(x, y).slice(0, 6)
                    .map(el => summarize(el, current.parent))
                }));
              }
            } catch (error) {
              levelInfo.parentInspectionError = String(error);
            }
          }
          result.levels.push(levelInfo);
          try {
            if (current === current.parent) break;
            current = current.parent;
          } catch (_) { break; }
        }
        console.info("[MOC3 transparency DOM diagnostic]", result);
      };

      window.addEventListener("load", () => setTimeout(run, 2500), { once: true });
    })();
  </script>
  <script src="/static/js/live2d/moc3/Core/live2dcubismcore.min.js"></script>
  <script type="module" crossorigin src="/static/js/live2d/moc3/runtime.js"></script>
</head>
<body></body>
</html>
