<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>语音播报设置</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="manager-page">
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">B站直播互动中心</div>
    <nav class="sidebar-nav">
      <a href="/dashboard">综合展示</a>
      <a href="/">接入中心</a>
      <a href="/live2d">Live2D</a>
      <a href="/danmaku">弹幕设置</a>
      <a href="/voice" class="active">语音播报</a>
      <a href="/music">歌曲点播</a>
      <a href="/music/settings">歌曲设置</a>
      <a href="/video">视频点播</a>
      <a href="/video/settings">视频设置</a>
      <a href="/settings">系统设置</a>
      <a href="/credentials">凭据管理</a>
    </nav>
  </aside>
  <main class="manager">
    <header class="page-header">
      <div><p class="eyebrow">VOICE MODULE</p><h1>语音播报</h1><p class="muted">Edge TTS 语音音色、触发类型与播报限制</p></div>
    </header>
    <p class="muted">模块启动、暂停、恢复和关闭请统一在接入中心的「功能启停控制」中操作。语音设置与试听功能保留在本页面。</p>
    <section class="panel">
      <h2>播报触发设置</h2>
      <div class="tts-switches">
        <label><input id="danmaku-enabled" type="checkbox"> 普通弹幕</label>
        <label><input id="gift-enabled" type="checkbox"> 礼物</label>
        <label><input id="sc-enabled" type="checkbox"> 醒目留言（SC）</label>
      </div>
      <label class="setting-field"><span>语音音色</span><select id="voice"></select></label>
      <label class="setting-field"><span>语速 <output id="rate-value"></output></span><input id="rate" type="range" min="-50" max="100" step="5"></label>
      <label class="setting-field"><span>音量 <output id="volume-value"></output></span><input id="volume" type="range" min="-50" max="50" step="5"></label>
      <label class="setting-field"><span>最大等待语音数量 <output id="queue-value"></output></span><input id="queue" type="range" min="1" max="200" step="1"></label>
      <label class="setting-field"><span>礼物最低播报金额（元）</span><input id="gift-min" type="number" min="0" max="100000" step="0.1"></label>
      <div class="inline-controls"><button id="save" type="button">保存语音设置</button></div>
      <p id="status" class="muted" role="status">正在读取设置…</p>
    </section>
    <section class="panel">
      <h2>语音试听</h2>
      <label class="setting-field"><span>试听文本</span><input id="test-text" type="text" value="欢迎来到直播间，感谢大家的支持！"></label>
      <div class="inline-controls"><button id="test" type="button" class="secondary-button">加入 OBS 语音试听队列</button></div><p class="muted">试听将通过 OBS 全局语音引擎播放，并与直播语音共用同一队列。</p>
      <p id="test-status" class="muted" role="status"></p>
    </section>
  </main>
</div>
<script>
const $=id=>document.getElementById(id);
async function api(url,options={}){const r=await fetch(url,{cache:"no-store",...options});const d=await r.json();if(!r.ok||d.ok===false)throw new Error(d.error||d.message||("HTTP "+r.status));return d}
function updateLabels(){$("rate-value").textContent=$("rate").value+"%";$("volume-value").textContent=$("volume").value+"%";$("queue-value").textContent=$("queue").value+" 条"}
async function load(){try{const d=await api("/api/voice/tts/settings");const p=d.preferences;$("danmaku-enabled").checked=p.danmaku_enabled;$("gift-enabled").checked=p.gift_enabled;$("sc-enabled").checked=p.super_chat_enabled;$("voice").replaceChildren(...d.voices.map(v=>{const o=document.createElement("option");o.value=v;o.textContent=v;return o}));$("voice").value=p.voice;$("rate").value=p.rate;$("volume").value=p.volume;$("queue").value=p.max_queue_length;$("gift-min").value=p.gift_min_amount;updateLabels();$("status").textContent="语音设置已加载。"}catch(e){$("status").textContent="读取失败："+e.message}}
async function save(){try{const payload={danmaku_enabled:$("danmaku-enabled").checked,gift_enabled:$("gift-enabled").checked,super_chat_enabled:$("sc-enabled").checked,voice:$("voice").value,rate:Number($("rate").value),volume:Number($("volume").value),max_queue_length:Number($("queue").value),gift_min_amount:Number($("gift-min").value)};const d=await api("/api/voice/tts/settings",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});$("status").textContent="设置已保存。";}catch(e){$("status").textContent="保存失败："+e.message}}
async function test(){try{$("test-status").textContent="正在加入 OBS 语音队列…";await api("/api/voice/tts/test",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:$("test-text").value})});$("test-status").textContent="试听已加入 OBS 全局语音队列。"}catch(e){$("test-status").textContent="加入试听失败："+e.message}}
$("rate").addEventListener("input",updateLabels);$("volume").addEventListener("input",updateLabels);$("queue").addEventListener("input",updateLabels);$("save").addEventListener("click",save);$("test").addEventListener("click",test);load();
</script>
</body>
</html>
