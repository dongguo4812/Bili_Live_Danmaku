<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>歌曲模块设置</title><link rel="stylesheet" href="/static/css/style.css"></head>
<body class="manager-page"><div class="app-shell">
<aside class="sidebar"><div class="sidebar-brand">B站直播互动中心</div><nav class="sidebar-nav">
      <a href="/dashboard">综合展示</a>
      <a href="/">接入中心</a>
      <a href="/live2d">Live2D</a>
      <a href="/voice">语音播报</a>
      <a href="/music">歌曲点播</a>
      <a href="/music/settings" class="active">歌曲设置</a>
      <a href="/video">视频点播</a>
      <a href="/video/settings">视频设置</a>
      <a href="/settings">系统设置</a>
      <a href="/credentials">凭据管理</a>
    </nav></aside>
<main class="manager">
<header class="page-header"><div><p class="eyebrow">MUSIC MODULE</p><h1>歌曲点播设置</h1><p class="muted">歌曲模块独立配置；修改前必须先关闭歌曲模块。</p></div><a href="/music">返回歌曲队列</a> <a href="/credentials">凭据管理</a></header>
<section class="panel">
<h2>洛雪音乐接口</h2>
<label class="setting-field"><span>API 地址</span><input id="base-url" type="url" placeholder="http://127.0.0.1:23330"></label>
<label class="setting-field"><span>接口超时（秒）</span><input id="timeout" type="number" min="2" max="30"></label>
</section>
<section class="panel">
<h2>点歌规则</h2>
<p class="muted">按固定顺序查询已选平台：QQ 音乐 → 酷狗音乐 → 网易云音乐 → 酷我音乐。至少选择一个平台。</p>
<div class="setting-field"><span>查询平台</span><div class="platform-options">
<label><input type="checkbox" name="music-platform" value="tx"> QQ 音乐</label>
<label><input type="checkbox" name="music-platform" value="kg"> 酷狗音乐</label>
<label><input type="checkbox" name="music-platform" value="wy"> 网易云音乐</label>
<label><input type="checkbox" name="music-platform" value="kw"> 酷我音乐</label>
</div></div>
<label class="setting-field"><span>每个平台搜索结果数量</span><input id="max-results" type="number" min="1" max="50"></label>
<label class="setting-field"><span>普通观众冷却时间（秒）</span><input id="cooldown" type="number" min="0" max="3600"></label>
<label class="setting-field"><span>歌曲队列上限</span><input id="queue-limit" type="number" min="1" max="1000"></label>
<label class="setting-field"><span>展示页待播歌曲显示数量</span><input id="display-queue-limit" type="number" min="1" max="1000"></label>
<label class="setting-field"><span>粉丝牌要求</span><select id="fan-medal"><option value="true">需要本直播间粉丝牌</option><option value="false">不要求粉丝牌</option></select></label>
<button id="save" type="button">保存歌曲配置</button><p id="status" class="muted" role="status"></p>
</section>

</main></div>
<script>
const $=id=>document.getElementById(id);
async function api(url,options={}){const r=await fetch(url,{cache:"no-store",...options});const d=await r.json();if(!r.ok||d.ok===false)throw new Error(d.error||d.message||("HTTP "+r.status));return d}
const platformBoxes=()=>Array.from(document.querySelectorAll('input[name="music-platform"]'));
async function load(){try{const d=await api("/api/music/settings");$("base-url").value=d.lx_music.base_url;$("timeout").value=d.lx_music.timeout_seconds;$("max-results").value=d.search.max_results_per_platform;const enabled=Array.isArray(d.search.enabled_platforms)?d.search.enabled_platforms:["tx","kg","wy","kw"];platformBoxes().forEach(box=>box.checked=enabled.includes(box.value));$("cooldown").value=d.requests.cooldown_seconds;$("queue-limit").value=d.requests.queue_limit;$("display-queue-limit").value=d.display.queue_display_limit??10;$("fan-medal").value=String(Boolean(d.requests.require_fans_medal));$("status").textContent="歌曲模块状态："+d.module_state+"。请先关闭模块再保存配置。"}catch(e){$("status").textContent="读取失败："+e.message}}
platformBoxes().forEach(box=>box.addEventListener("change",()=>{if(!platformBoxes().some(item=>item.checked)){box.checked=true;$("status").textContent="至少保留一个音乐查询平台。";}}));
$("save").addEventListener("click",async()=>{try{const enabledPlatforms=platformBoxes().filter(box=>box.checked).map(box=>box.value);if(!enabledPlatforms.length)throw new Error("至少选择一个音乐查询平台。");const d=await api("/api/music/settings",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({base_url:$("base-url").value,timeout_seconds:Number($("timeout").value),max_results_per_platform:Number($("max-results").value),enabled_platforms:enabledPlatforms,cooldown_seconds:Number($("cooldown").value),queue_limit:Number($("queue-limit").value),queue_display_limit:Number($("display-queue-limit").value),require_fans_medal:$("fan-medal").value==="true"})});$("status").textContent=d.message;}catch(e){$("status").textContent="保存失败："+e.message}});
load();
</script></body></html>
