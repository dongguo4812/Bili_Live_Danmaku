<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>综合展示</title>
<style>
:root{color-scheme:dark;font-family:"Microsoft YaHei UI","Microsoft YaHei",sans-serif;color:#f4f6fb}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
body.editor-mode{background:#10131a;color:#f4f6fb}
.toolbar{position:fixed;z-index:1000;left:0;right:0;top:0;min-height:54px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;background:#171d29;border-bottom:1px solid #354056}
.editor-mode .toolbar{left:218px}
.toolbar[hidden]{display:none}
.editor-sidebar{position:fixed;z-index:1100;left:0;top:0;bottom:0;width:218px;padding:22px 14px;background:#141b27;border-right:1px solid rgba(255,255,255,.1)}
.editor-sidebar .brand{font-size:15px;font-weight:800;margin:0 8px 24px}
.editor-sidebar nav{display:flex;flex-direction:column;gap:6px}
.editor-sidebar a{display:block;padding:10px 12px;border-radius:8px;color:#c6d0e0;text-decoration:none;font-size:13px}
.editor-sidebar a.active{background:#2c3d59;color:#fff;font-weight:700}
.editor-sidebar a:hover{background:rgba(255,255,255,.07)}
.toolbar strong{margin-right:12px}
.toolbar button,.widget button{border:1px solid #53627c;border-radius:7px;padding:7px 10px;background:#29364a;color:#f4f6fb;font:inherit;font-size:12px;cursor:pointer}
.toolbar button.primary{background:#5478bd;border-color:#7895d2}
.toolbar button:disabled{opacity:.45;cursor:not-allowed}
#layout-message{font-size:12px;color:#b8c4d8}
.editor-control{display:flex;align-items:center;gap:6px;font-size:12px;color:#d6deeb}
.editor-control[hidden]{display:none!important}
.editor-control select,.editor-control input{accent-color:#789be0}
.editor-control input[type=range]{width:110px}
.editor-control output{min-width:42px;color:#ffd66b;font-variant-numeric:tabular-nums}
#stage{position:absolute;inset:0;overflow:hidden;background:transparent}
.editor-mode #stage{top:58px;left:218px;right:0;bottom:0;background-color:#111722;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:24px 24px}
.widget{position:absolute;min-width:10%;min-height:10%;overflow:hidden;border:1px solid rgba(255,255,255,.2);border-radius:10px;background:rgba(15,20,30,.82);box-shadow:0 8px 24px rgba(0,0,0,.2);backdrop-filter:blur(7px);display:flex;flex-direction:column}
.display-mode .widget{border-color:transparent;border-radius:0;background:transparent;box-shadow:none;backdrop-filter:none}
.widget-header{flex:0 0 30px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 9px;background:rgba(255,255,255,.07);font-size:12px;font-weight:800;cursor:move;user-select:none;touch-action:none}
.display-mode .widget-header{background:transparent;padding:2px 5px}
.widget-actions{display:flex;gap:5px}
.widget-actions button{padding:2px 6px;font-size:11px}
.widget-body{flex:1;min-height:0;overflow:hidden;padding:10px 12px;font-size:14px;line-height:1.55}
.widget .media-display{overflow:hidden}
.display-mode .widget-body{padding:5px 8px}
.widget.live2d .widget-body,.widget.music_widget .widget-body{padding:0;overflow:hidden}
.widget.live2d .widget-body{position:relative;display:flex;align-items:center;justify-content:center;background:rgba(15,20,30,.35)}
.editor-mode .widget.live2d .widget-header,.editor-mode .widget.music_widget .widget-header{position:absolute;z-index:10;top:0;left:0;right:0}
.editor-mode .widget.live2d .widget-body,.editor-mode .widget.music_widget .widget-body{position:absolute;inset:0;width:auto;height:auto;padding:0;overflow:hidden}
.widget.live2d iframe,.widget.music_widget iframe{width:100%;height:100%;border:0;background:transparent}
/* 歌曲信息组件直接呈现 /music/widget 原页面，不显示综合展示容器标题栏。 */
.display-mode .widget.music_widget{border:0;border-radius:0;background:transparent;box-shadow:none;backdrop-filter:none}
.display-mode .widget.music_widget .widget-header{display:none}
.display-mode .widget.music_widget .widget-body{flex:1;min-height:0;padding:0;overflow:hidden}
/* Live2D 使用模块自身的完整视口；隐藏标题栏，避免压缩 iframe 的可用高度。 */
.display-mode .widget.live2d .widget-header{display:none}
.display-mode .widget.live2d .widget-body{flex:1;min-height:0;padding:0;overflow:hidden;background:transparent}
.widget video,.widget .video-frame{display:none!important}
.voice-engine{position:absolute;left:0;top:0;width:2px;height:2px;opacity:.01;pointer-events:none;border:0}
.widget .muted{color:#b8c3d4;font-size:calc(12px * var(--content-scale, 1))}
.widget .primary-line{font-size:calc(17px * var(--content-scale, 1));font-weight:800;overflow-wrap:anywhere}
.widget .row{display:flex;gap:8px;align-items:baseline;justify-content:space-between;margin:5px 0;font-size:calc(14px * var(--content-scale, 1))}
.widget .queue-item{padding:5px 0;border-top:1px solid rgba(255,255,255,.1);font-size:calc(12px * var(--content-scale, 1));overflow-wrap:anywhere}
.widget .notice{margin-top:6px;padding:5px 7px;border-radius:6px;background:rgba(255,255,255,.07);font-size:calc(12px * var(--content-scale, 1))}
.widget .notice.error{color:#ffb1b1}
.resize-handle{display:none}
.editor-mode .widget .resize-handle{position:absolute;z-index:5;display:block;touch-action:none}
.editor-mode .widget .resize-e,.editor-mode .widget .resize-w{top:18px;bottom:18px;width:8px;cursor:ew-resize}
.editor-mode .widget .resize-e{right:0}
.editor-mode .widget .resize-w{left:0}
.editor-mode .widget .resize-n,.editor-mode .widget .resize-s{left:18px;right:18px;height:8px;cursor:ns-resize}
.editor-mode .widget .resize-n{top:0}
.editor-mode .widget .resize-s{bottom:0}
.editor-mode .widget .resize-ne,.editor-mode .widget .resize-nw,.editor-mode .widget .resize-se,.editor-mode .widget .resize-sw{width:14px;height:14px}
.editor-mode .widget .resize-ne{right:0;top:0;cursor:nesw-resize}
.editor-mode .widget .resize-nw{left:0;top:0;cursor:nwse-resize}
.editor-mode .widget .resize-se{right:0;bottom:0;cursor:nwse-resize;background:linear-gradient(135deg,transparent 45%,#9bb8f5 46%,#9bb8f5 56%,transparent 57%)}
.editor-mode .widget .resize-sw{left:0;bottom:0;cursor:nesw-resize}
.empty{color:#aeb9ca;font-size:13px}
@media(max-width:800px){.editor-sidebar{position:relative;width:100%;height:auto;bottom:auto;padding:10px 12px}.editor-sidebar .brand{margin:0 0 8px}.editor-sidebar nav{flex-direction:row;overflow-x:auto}.editor-sidebar a{white-space:nowrap;padding:8px 10px}.editor-mode .toolbar{left:0;top:96px}.editor-mode #stage{left:0;top:160px}}
@media(max-width:650px){.toolbar strong{width:100%}.widget-header{flex-basis:26px}.widget-body{padding:6px;font-size:12px}.widget .primary-line{font-size:14px}}
/* Force alpha transparency through the combined-output Live2D widget and iframe. */
.display-mode #stage,
.display-mode .widget,
.display-mode .widget.live2d,
.display-mode .widget.live2d .widget-body,
.display-mode .widget.live2d iframe {
  background: transparent !important;
  background-color: transparent !important;
}
</style>
<link rel="stylesheet" href="{{ url_for('static', filename='display_media.css') }}">
</head>
<body class="{% if display_mode %}display-mode{% else %}editor-mode{% endif %}" data-display-mode="{{ '1' if display_mode else '0' }}" data-layout-id="{{ layout_id }}">
{% if not display_mode %}
<aside class="editor-sidebar">
  <div class="brand">B站直播互动中心</div>
  <nav>
    <a href="/dashboard" class="active">综合展示</a>
    <a href="/">接入中心</a>
    <a href="/live2d">Live2D</a>
    <a href="/voice">语音播报</a>
    <a href="/music">歌曲点播</a>
    <a href="/music/settings">歌曲设置</a>
    <a href="/video">视频点播</a>
    <a href="/video/settings">视频设置</a>
    <a href="/settings">系统设置</a>
    <a href="/credentials">凭据管理</a>
  </nav>
</aside>
{% endif %}
<div class="toolbar" id="toolbar" {% if display_mode %}hidden{% endif %}>
  <strong>综合展示布局</strong>
  <select id="layout-select" aria-label="选择布局" style="max-width:170px;padding:7px 9px;border:1px solid #53627c;border-radius:7px;background:#202b3b;color:#f4f6fb"></select>
  <button type="button" id="new-layout">新建布局</button>
  <button type="button" id="duplicate-layout">复制布局</button>
  <button type="button" id="rename-layout">重命名</button>
  <button type="button" id="delete-layout">删除布局</button>
  <button type="button" id="activate-layout">设为默认</button>
  <button type="button" data-add="live2d">添加 Live2D</button>
  <button type="button" data-add="voice">添加语音</button>
  <button type="button" data-add="music">添加歌曲</button>
  <button type="button" data-add="music_widget">添加歌曲信息</button>
  <button type="button" data-add="video">添加视频</button>
  <button type="button" data-add="danmaku">添加弹幕</button>
  <button type="button" class="primary" id="save-layout">保存当前布局</button>
  <button type="button" id="reset-layout">恢复默认布局</button>
  <button type="button" id="open-output">打开 OBS 展示页</button>
  <label class="editor-control">当前模块
    <select id="selected-widget" aria-label="选择要调整内容大小的模块" style="padding:5px;background:#202b3b;color:#f4f6fb;border:1px solid #53627c;border-radius:6px"></select>
  </label>
  <label class="editor-control" id="font-scale-control">字体大小
    <input id="font-scale" type="range" min="50" max="200" step="5" value="100">
    <output id="font-scale-value">100%</output>
  </label>
  <label class="editor-control" id="content-scale-control" hidden>整体缩放
    <input id="content-scale" type="range" min="50" max="200" step="5" value="100">
    <output id="content-scale-value">100%</output>
  </label>
  <span id="layout-message">拖动模块内部移动；拖动边缘调整单一方向，拖动角点同时调整宽高。</span>
</div>
<div id="stage"></div>
<script src="{{ url_for('static', filename='display_media.js') }}"></script>
<script>
(() => {
  const displayMode = document.body.dataset.displayMode === "1";
  const stage = document.getElementById("stage");
  const message = document.getElementById("layout-message");
  const labels = {live2d:"Live2D",voice:"语音播报",music:"歌曲点播",music_widget:"歌曲信息",video:"视频点播",danmaku:"直播弹幕"};
  let layout = {version:1,widgets:[]};
  let danmakuAfter = 0;
  let danmakuCursorReady = false;
  let refreshInFlight = false;
  let dragState = null;
  let selectedWidgetType = "";
  let latestData = {voiceSpeech:{current:"",queue:[]}};
  window.addEventListener("message",event=>{
    if(event.origin!==window.location.origin || !event.data || event.data.type!=="combined-tts-state") return;
    latestData.voiceSpeech={
      current:String(event.data.current||""),
      queue:Array.isArray(event.data.queue)?event.data.queue.map(value=>String(value)):[]
    };
    const body=stage.querySelector('[data-widget="voice"] .widget-body');
    if(body) renderVoice(body);
  });

  async function api(url, options={}) {
    const response = await fetch(url,{cache:"no-store",...options});
    const data = await response.json();
    if(!response.ok || data.ok===false) throw new Error(data.error||data.message||("HTTP "+response.status));
    return data;
  }

  function setMessage(text,error=false){
    if(message){message.textContent=text;message.style.color=error?"#ffaaaa":"#b8c4d8";}
  }

  function make(tag,cls,text){
    const node=document.createElement(tag);
    if(cls) node.className=cls;
    if(text!==undefined) node.textContent=text;
    return node;
  }

  function addWidget(type){
    if(layout.widgets.some(w=>w.type===type)) return;
    const size={w:28,h:36};
    let position=null;
    // 从左上到右下寻找不与现有模块重叠的位置，避免新模块默认叠在一起。
    for(let y=2;y<=62&&!position;y+=4){
      for(let x=2;x<=70;x+=4){
        const candidate={x,y,...size};
        const overlaps=layout.widgets.some(item=>
          candidate.x<item.x+item.w && candidate.x+candidate.w>item.x &&
          candidate.y<item.y+item.h && candidate.y+candidate.h>item.y
        );
        if(!overlaps){position=candidate;break;}
      }
    }
    if(!position){
      setMessage("当前布局没有足够的空白区域；请先缩小或移动已有模块。",true);
      return;
    }
    layout.widgets.push({id:type,type,...position});
    renderLayout();
    setMessage(labels[type]+" 已添加；保存后才会保留。");
  }

  function removeWidget(type){
    layout.widgets=layout.widgets.filter(w=>w.type!==type);
    renderLayout();
  }

  function syncLive2DFrame(widget){
    if(!widget || widget.dataset.widget!=="live2d") return;
    const body=widget.querySelector(".widget-body");
    const frame=body?.querySelector("iframe");
    if(!body || !frame) return;

    // 保留完整舞台尺寸的 Live2D 视口，避免模块尺寸改变模型缩放。
    // 将完整视口居中放在模块内部：模型默认位于视口中心，因此无论模块
    // 放在舞台哪个位置，模型中心都会落在模块可见区域，而不会被裁到模块外。
    frame.style.position="absolute";
    frame.style.width=stage.clientWidth+"px";
    frame.style.height=stage.clientHeight+"px";
    frame.style.maxWidth="none";
    frame.style.maxHeight="none";
    frame.style.left=((body.clientWidth-stage.clientWidth)/2)+"px";
    frame.style.top=((body.clientHeight-stage.clientHeight)/2)+"px";
    frame.style.border="0";
  }

  function syncAllLive2DFrames(){
    stage.querySelectorAll('[data-widget="live2d"]').forEach(syncLive2DFrame);
  }

  function positionWidget(node,item){
    node.style.left=item.x+"%";
    node.style.top=item.y+"%";
    node.style.width=item.w+"%";
    node.style.height=item.h+"%";
    node.style.setProperty("--content-scale",String((Number(item.font_scale)||100)/100));
    syncLive2DFrame(node);
  }

  function selectWidget(type){
    selectedWidgetType=type||"";
    const item=layout.widgets.find(w=>w.type===selectedWidgetType);
    const select=document.getElementById("selected-widget");
    const fontControl=document.getElementById("font-scale-control");
    const overallControl=document.getElementById("content-scale-control");
    const fontSlider=document.getElementById("font-scale");
    const overallSlider=document.getElementById("content-scale");
    if(select) select.value=selectedWidgetType;
    const fontEnabled=!!item && ["music","video","danmaku","voice"].includes(item.type);
    const overallEnabled=!!item && item.type==="music_widget";
    if(fontControl) fontControl.hidden=!fontEnabled;
    if(overallControl) overallControl.hidden=!overallEnabled;
    if(fontSlider) fontSlider.value=String(item?.font_scale??100);
    if(overallSlider) overallSlider.value=String(item?.content_scale??100);
    const fontValue=document.getElementById("font-scale-value");
    const overallValue=document.getElementById("content-scale-value");
    if(fontValue) fontValue.textContent=(item?.font_scale??100)+"%";
    if(overallValue) overallValue.textContent=(item?.content_scale??100)+"%";
  }

  function applyContentScale(item){
    const widget=stage.querySelector('[data-widget="'+item.type+'"]');
    if(widget) positionWidget(widget,item);
    const body=widget?.querySelector(".widget-body");
    if(item.type==="music_widget" && body){
      const frame=body.querySelector("iframe");
      if(frame){
        const scale=(Number(item.content_scale)||100)/100;
        frame.contentWindow?.postMessage({type:"music-widget-scale",scale},window.location.origin);
      }
    }
  }

  function startPointerEdit(event,item,mode){
    if(displayMode || event.button!==0) return;
    if(event.target.closest("button")) return;
    event.preventDefault();
    selectWidget(item.type);
    const rect=stage.getBoundingClientRect();
    dragState={item,mode,startX:event.clientX,startY:event.clientY,original:{x:item.x,y:item.y,w:item.w,h:item.h},rect};
    window.addEventListener("pointermove",movePointerEdit);
    window.addEventListener("pointerup",endPointerEdit,{once:true});
    window.addEventListener("pointercancel",endPointerEdit,{once:true});
  }

  function movePointerEdit(event){
    if(!dragState) return;
    const dx=(event.clientX-dragState.startX)/dragState.rect.width*100;
    const dy=(event.clientY-dragState.startY)/dragState.rect.height*100;
    const {item,mode,original}=dragState;
    if(mode==="move"){
      item.x=Math.max(0,Math.min(100-item.w,original.x+dx));
      item.y=Math.max(0,Math.min(100-item.h,original.y+dy));
    }else{
      const minSize=12;
      if(mode.includes("e")) item.w=Math.max(minSize,Math.min(100-original.x,original.w+dx));
      if(mode.includes("s")) item.h=Math.max(minSize,Math.min(100-original.y,original.h+dy));
      if(mode.includes("w")){
        const right=original.x+original.w;
        const nextX=Math.max(0,Math.min(right-minSize,original.x+dx));
        item.x=nextX; item.w=right-nextX;
      }
      if(mode.includes("n")){
        const bottom=original.y+original.h;
        const nextY=Math.max(0,Math.min(bottom-minSize,original.y+dy));
        item.y=nextY; item.h=bottom-nextY;
      }
    }
    const node=stage.querySelector('[data-widget="'+item.type+'"]');
    if(node) positionWidget(node,item);
  }

  function endPointerEdit(){
    window.removeEventListener("pointermove",movePointerEdit);
    window.removeEventListener("pointerup",endPointerEdit);
    window.removeEventListener("pointercancel",endPointerEdit);
    dragState=null;
    setMessage("布局已调整；点击“保存当前布局”写入本地配置。");
  }

  function renderMusic(body){
    MediaDisplay.render(body,"music",latestData.music||{},{compact:true,showInstruction:false});
  }

  function renderMusicWidget(body,item){
    // 编辑模式与 OBS 展示模式均加载独立歌曲信息页面，确保预览与最终显示一致。
    const frame=document.createElement("iframe");
    frame.src="/music/widget?embedded=1&scale="+encodeURIComponent((Number(item?.content_scale)||100)/100);
    frame.title="歌曲信息展示组件";
    frame.loading="eager";
    frame.setAttribute("allowtransparency", "true");
    frame.style.background = "transparent";
    body.appendChild(frame);
  }

  function renderVideo(body){
    // 综合展示仅呈现视频信息，不加载或嵌入实际视频画面。
    MediaDisplay.render(body,"video",latestData.video||{},{compact:true,showInstruction:false});
  }

  function renderVoice(body){
    const data=latestData.voice||{};
    const prefs=data.preferences||{};
    body.appendChild(make("div","primary-line","语音播报"));
    const enabled = !!(prefs.danmaku_enabled || prefs.gift_enabled || prefs.super_chat_enabled);
    const moduleState = data.module_state || "stopped";
    body.appendChild(make("div","row","模块："+({running:"运行中",paused:"已暂停",stopped:"已关闭",error:"运行异常"}[moduleState]||moduleState)));
    body.appendChild(make("div","row","触发："+(enabled?"已启用":"已关闭")));
    const speech=latestData.voiceSpeech||{current:"",queue:[]};
    body.appendChild(make("div","primary-line","正在播报"));
    body.appendChild(make("div","queue-item",speech.current||"当前没有语音播报"));
    body.appendChild(make("div","primary-line","等待播报（"+speech.queue.length+"）"));
    if(speech.queue.length){
      speech.queue.forEach((text,index)=>body.appendChild(make("div","queue-item",(index+1)+". "+text)));
    }else{
      body.appendChild(make("div","muted","等待队列为空"));
    }
    body.appendChild(make("div","muted","音色："+(prefs.voice||"默认")));
    body.appendChild(make("div","muted","语速："+(prefs.rate||"+0%")+" · 音量："+(prefs.volume||"+0%")));
  }

  function renderDanmaku(body){
    const items=latestData.danmaku||[];
    if(!items.length){body.appendChild(make("div","empty","等待新弹幕…"));return;}
    items.slice(-12).forEach(item=>{
      body.appendChild(make("div","queue-item",(item.nickname||"观众")+"： "+(item.text||"")));
    });
  }

  function renderLive2DPreview(body){
    // 编辑器始终使用完整 Live2D 展示页预览，不提供静音开关。
    body.replaceChildren();
    const frame=document.createElement("iframe");
    frame.src="/live2d/display?embedded=1";
    frame.title="Live2D 展示预览（包含模型和弹幕框）";
    frame.loading="eager";
    frame.setAttribute("allowtransparency","true");
    frame.style.background="transparent";
    body.appendChild(frame);
  }

  function renderWidgetContent(body,type,item){
    body.replaceChildren();
    if(type==="live2d"){
      if(displayMode){
        const frame=document.createElement("iframe");
        frame.src="/live2d/display?embedded=1";
        frame.title="Live2D 展示";
        frame.allow="autoplay";
        body.appendChild(frame);
      }else{
        renderLive2DPreview(body);
      }
    }else if(type==="music_widget") renderMusicWidget(body,item);
    else if(type==="music") renderMusic(body);
    else if(type==="video") renderVideo(body);
    else if(type==="voice") renderVoice(body);
    else if(type==="danmaku") renderDanmaku(body);
  }

  function renderLayout(){
    stage.replaceChildren();
    layout.widgets.forEach(item=>{
      const widget=make("section","widget "+item.type);
      widget.dataset.widget=item.type;
      positionWidget(widget,item);
      const header=make("header","widget-header",labels[item.type]||item.type);
      const actions=make("div","widget-actions");
      if(!displayMode){
        const remove=make("button","","移除");
        remove.type="button";
        remove.addEventListener("click",()=>removeWidget(item.type));
        actions.appendChild(remove);
      }
      header.appendChild(actions);
      header.addEventListener("pointerdown",event=>startPointerEdit(event,item,"move"));
      widget.addEventListener("pointerdown",event=>{
        if(event.target.closest(".resize-handle,button,select,input,textarea,iframe,.widget-header")) return;
        startPointerEdit(event,item,"move");
      });
      const body=make("div","widget-body");
      renderWidgetContent(body,item.type,item);
      widget.appendChild(header);
      widget.appendChild(body);
      if(!displayMode){
        ["n","s","e","w","ne","nw","se","sw"].forEach(direction=>{
          const handle=make("div","resize-handle resize-"+direction);
          handle.dataset.resize=direction;
          handle.addEventListener("pointerdown",event=>startPointerEdit(event,item,direction));
          widget.appendChild(handle);
        });
      }
      stage.appendChild(widget);
      syncLive2DFrame(widget);
    });
    // 若只选择语音而未添加 Live2D 画面，仍加载隐藏的音频引擎 iframe。
    if(displayMode && layout.widgets.some(w=>w.type==="voice") && !layout.widgets.some(w=>w.type==="live2d")){
      const engine=document.createElement("iframe");
      engine.className="voice-engine";
      engine.src="/live2d/display?embedded=1";
      engine.title="语音播报音频引擎";
      engine.allow="autoplay";
      stage.appendChild(engine);
    }
    if(!displayMode){
      document.querySelectorAll("[data-add]").forEach(button=>{
        button.disabled=layout.widgets.some(w=>w.type===button.dataset.add);
      });
      const select=document.getElementById("selected-widget");
      if(select){
        const previous=selectedWidgetType;
        select.replaceChildren();
        layout.widgets.forEach(item=>{
          const option=document.createElement("option");
          option.value=item.type; option.textContent=labels[item.type]||item.type;
          select.appendChild(option);
        });
        if(layout.widgets.some(w=>w.type===previous)) selectWidget(previous);
        else selectWidget(layout.widgets[0]?.type||"");
      }
    }
  }

  async function loadLayout(){
    try{
      const data=await api("/api/display/layout");
      layout=data.layout||{version:1,widgets:[]};
      renderLayout();
    }catch(error){setMessage("读取布局失败："+error.message,true);}
  }

  async function resetLayout(){
    if(!window.confirm("恢复默认布局？当前未保存的拖动和缩放会丢失。")) return;
    try{
      const data=await api("/api/display/layout/default");
      layout=data.layout||{version:1,widgets:[]};
      renderLayout();
      setMessage("默认布局已恢复到编辑区；点击“保存当前布局”后才会写入配置。");
    }catch(error){setMessage("恢复默认布局失败："+error.message,true);}
  }

  async function saveLayout(){
    try{
      const data=await api("/api/display/layout",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({layout_id:layoutId,layout})
      });
      layout=data.layout;
      setMessage(data.message||"布局已保存。");
    }catch(error){setMessage("保存失败："+error.message,true);}
  }

  async function refreshData(){
    if(refreshInFlight) return;
    refreshInFlight=true;
    try{
      const [music,video,voice,modules]=await Promise.all([
        api("/api/music/queue"),api("/api/video/queue"),api("/api/voice/tts/settings"),api("/api/modules")
      ]);
      latestData.music=music;
      latestData.video=video;
      latestData.voice=voice;
      latestData.voice.module_state=(modules.modules.voice||{}).state||"stopped";

      // 首次只读取当前最新事件游标，不回放断线前缓存的旧弹幕；之后只取游标之后的新事件。
      if(!danmakuCursorReady){
        const cursor=await api("/api/danmaku?latest=1");
        danmakuAfter=Number(cursor.latest_id)||0;
        danmakuCursorReady=true;
        latestData.danmaku=[];
      }else{
        const danmaku=await api("/api/danmaku?after="+encodeURIComponent(danmakuAfter));
        latestData.danmaku=Array.isArray(danmaku.items)?danmaku.items:[];
        for(const item of latestData.danmaku){
          const id=Number(item.id)||0;
          if(id>danmakuAfter) danmakuAfter=id;
        }
      }

      layout.widgets.forEach(item=>{
        const node=stage.querySelector('[data-widget="'+item.type+'"] .widget-body');
        if(node && item.type!=="live2d" && item.type!=="music_widget") renderWidgetContent(node,item.type,item);
      });
    }catch(error){
      if(displayMode) console.debug("综合展示数据刷新失败",error);
    }finally{
      refreshInFlight=false;
    }
  }

  document.querySelectorAll("[data-add]").forEach(button=>{
    button.addEventListener("click",()=>addWidget(button.dataset.add));
  });
  const selectedWidgetSelect=document.getElementById("selected-widget");
  if(selectedWidgetSelect) selectedWidgetSelect.addEventListener("change",()=>selectWidget(selectedWidgetSelect.value));
  const fontScaleSlider=document.getElementById("font-scale");
  if(fontScaleSlider) fontScaleSlider.addEventListener("input",()=>{
    const item=layout.widgets.find(w=>w.type===selectedWidgetType); if(!item)return;
    item.font_scale=Number(fontScaleSlider.value);
    const value=document.getElementById("font-scale-value"); if(value)value.textContent=item.font_scale+"%";
    applyContentScale(item);
  });
  const contentScaleSlider=document.getElementById("content-scale");
  if(contentScaleSlider) contentScaleSlider.addEventListener("input",()=>{
    const item=layout.widgets.find(w=>w.type===selectedWidgetType); if(!item)return;
    item.content_scale=Number(contentScaleSlider.value);
    const value=document.getElementById("content-scale-value"); if(value)value.textContent=item.content_scale+"%";
    applyContentScale(item);
  });
  const saveButton=document.getElementById("save-layout");
  if(saveButton) saveButton.addEventListener("click",saveLayout);
  const resetButton=document.getElementById("reset-layout");
  if(resetButton) resetButton.addEventListener("click",resetLayout);

  let layoutId="";
  let layoutItems=[];
  let activeLayoutId="";
  const layoutSelect=document.getElementById("layout-select");

  async function loadLayoutList(){
    const data=await api("/api/display/layouts");
    layoutItems=data.layouts||[];
    activeLayoutId=data.active_layout_id||"";
    if(layoutSelect){
      layoutSelect.replaceChildren();
      layoutItems.forEach(item=>{
        const option=document.createElement("option");
        option.value=item.id;
        option.textContent=item.name+(item.id===activeLayoutId?"（默认）":"");
        layoutSelect.appendChild(option);
      });
    }
  }

  async function selectLayout(nextId,discard=true){
    if(!nextId||nextId===layoutId)return;
    if(discard&&!window.confirm("切换布局会放弃当前尚未保存的修改，确定继续吗？")){
      if(layoutSelect)layoutSelect.value=layoutId;
      return;
    }
    const data=await api("/api/display/layout?layout_id="+encodeURIComponent(nextId));
    layoutId=nextId;
    layout=data.layout||{version:1,widgets:[]};
    renderLayout();
    if(layoutSelect)layoutSelect.value=layoutId;
    const url=new URL(window.location.href);
    url.searchParams.set("layout",layoutId);
    window.history.replaceState({},document.title,url.pathname+url.search);
    setMessage("已切换到布局："+(data.name||layoutId));
  }

  async function createLayout(copyCurrent=false){
    const name=window.prompt("请输入新布局名称：");
    if(!name||!name.trim())return;
    try{
      const data=await api("/api/display/layouts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:name.trim(),source_layout_id:copyCurrent?layoutId:""})});
      await loadLayoutList();
      await selectLayout(data.layout_id,false);
      setMessage("布局“"+data.name+"”已创建。");
    }catch(error){setMessage("创建布局失败："+error.message,true);}
  }

  async function renameLayout(){
    const current=layoutItems.find(item=>item.id===layoutId);
    if(!current)return;
    const name=window.prompt("请输入新的布局名称：",current.name);
    if(!name||!name.trim())return;
    try{
      await api("/api/display/layouts/"+encodeURIComponent(layoutId),{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:name.trim()})});
      await loadLayoutList();
      if(layoutSelect)layoutSelect.value=layoutId;
      setMessage("布局已重命名。");
    }catch(error){setMessage("重命名失败："+error.message,true);}
  }

  async function deleteLayout(){
    const current=layoutItems.find(item=>item.id===layoutId);
    if(!current||layoutItems.length<=1){setMessage("至少需要保留一套布局。",true);return;}
    if(!window.confirm("确定删除布局“"+current.name+"”？此操作不可撤销。"))return;
    try{
      const data=await api("/api/display/layouts/"+encodeURIComponent(layoutId),{method:"DELETE"});
      await loadLayoutList();
      await selectLayout(data.active_layout_id,false);
      setMessage("布局已删除，已切换到默认布局。");
    }catch(error){setMessage("删除失败："+error.message,true);}
  }

  async function activateLayout(){
    try{
      await api("/api/display/layouts/"+encodeURIComponent(layoutId),{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({activate:true})});
      await loadLayoutList();
      if(layoutSelect)layoutSelect.value=layoutId;
      setMessage("已将当前布局设为 /display/combined 默认展示。");
    }catch(error){setMessage("设置默认布局失败："+error.message,true);}
  }

  if(layoutSelect)layoutSelect.addEventListener("change",()=>selectLayout(layoutSelect.value));
  const newButton=document.getElementById("new-layout");
  if(newButton)newButton.addEventListener("click",()=>createLayout(false));
  const duplicateButton=document.getElementById("duplicate-layout");
  if(duplicateButton)duplicateButton.addEventListener("click",()=>createLayout(true));
  const renameButton=document.getElementById("rename-layout");
  if(renameButton)renameButton.addEventListener("click",renameLayout);
  const deleteButton=document.getElementById("delete-layout");
  if(deleteButton)deleteButton.addEventListener("click",deleteLayout);
  const activateButton=document.getElementById("activate-layout");
  if(activateButton)activateButton.addEventListener("click",activateLayout);

  const openOutput=document.getElementById("open-output");
  if(openOutput)openOutput.addEventListener("click",()=>window.open("/display/combined/"+encodeURIComponent(layoutId),"_blank","noopener"));

  (async()=>{
    try{
      if(displayMode){
        layoutId=document.body.dataset.layoutId||"";
        const endpoint="/api/display/layout"+(layoutId?"?layout_id="+encodeURIComponent(layoutId):"");
        const data=await api(endpoint);
        layoutId=data.layout_id||layoutId;
        layout=data.layout||{version:1,widgets:[]};
        renderLayout();
      }else{
        await loadLayoutList();
        const requested=new URLSearchParams(window.location.search).get("layout");
        layoutId=layoutItems.some(item=>item.id===requested)?requested:activeLayoutId;
        const data=await api("/api/display/layout?layout_id="+encodeURIComponent(layoutId));
        layout=data.layout||{version:1,widgets:[]};
        renderLayout();
        if(layoutSelect)layoutSelect.value=layoutId;
      }
      const requestedWidget=new URLSearchParams(window.location.search).get("add");
      if(requestedWidget==="music_widget"&&!displayMode){
        addWidget("music_widget");
        window.history.replaceState({},document.title,window.location.pathname+"?layout="+encodeURIComponent(layoutId));
      }
      refreshData();
    }catch(error){setMessage("读取布局失败："+error.message,true);}
  })();
  setInterval(refreshData,2000);

  // 舞台尺寸变化时同步调整 iframe 的完整视口，避免综合展示窗口尺寸
  // 改变后 Live2D 仍使用旧画布尺寸。
  if(typeof ResizeObserver!=="undefined"){
    const live2dStageObserver=new ResizeObserver(syncAllLive2DFrames);
    live2dStageObserver.observe(stage);
  }
  window.addEventListener("resize",syncAllLive2DFrames);
})();
</script>
</body>
</html>
