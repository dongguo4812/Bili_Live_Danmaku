<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>B站直播弹幕助手</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="manager-page">
  <main class="manager">
    <header class="page-header">
      <div>
        <p class="eyebrow">BILI LIVE DANMAKU</p>
        <h1>B站直播弹幕助手</h1>
        <p class="muted">本地管理中心 · OBS Live2D 展示</p>
      </div>
      <span id="server-state" class="status-pill">正在检查</span>
    </header>

    <section class="panel">
      <h2>运行状态</h2>
      <div class="status-grid">
        <div><span class="muted">B站登录</span><strong id="login-state">未登录</strong></div>
        <div><span class="muted">直播连接</span><strong id="connection-state">未连接</strong></div>
        <div><span class="muted">MOC2 运行时</span><strong id="runtime-state">尚未接入</strong></div>
      </div>
      <p id="status-message" class="muted">正在读取状态…</p>
    </section>

    <section class="panel">
      <h2>默认模型</h2>
      <div class="model-row">
        <div>
          <strong>live_uu</strong>
          <p class="muted">Live2D Cubism 2（MOC2）</p>
        </div>
        <span id="model-state" class="status-pill">检查中</span>
      </div>
      <p class="muted">模型目录：<code>models/live_uu/</code></p>
      <p class="muted">请自行放入具有合法使用授权的模型文件；模型资源不会随项目自动分发。</p>
    </section>

    <section class="panel">
      <h2>OBS 展示</h2>
      <p>浏览器源地址：</p>
      <code>http://127.0.0.1:8768/display</code>
      <p class="muted">建议 OBS 浏览器源画布分辨率与实际输出分辨率一致。</p>
    </section>
  </main>
  <script>
    async function refreshStatus() {
      const pill = document.getElementById("server-state");
      try {
        const response = await fetch("/api/status", { cache: "no-store" });
        if (!response.ok) throw new Error("HTTP " + response.status);
        const data = await response.json();
        pill.textContent = "服务运行中";
        pill.classList.add("ok");
        document.getElementById("login-state").textContent =
          data.bilibili.logged_in ? "已登录" : "未登录";
        document.getElementById("connection-state").textContent =
          data.bilibili.connected ? "已连接" : "未连接";
        document.getElementById("runtime-state").textContent =
          data.live2d.runtime_ready ? "已就绪" : "尚未接入";
        document.getElementById("model-state").textContent =
          data.live2d.config_exists ? "已找到配置" : "缺少模型配置";
        document.getElementById("status-message").textContent =
          data.bilibili.message + " " + data.live2d.message;
      } catch (error) {
        pill.textContent = "服务不可用";
        pill.classList.remove("ok");
        document.getElementById("status-message").textContent = error.message;
      }
    }
    refreshStatus();
    setInterval(refreshStatus, 3000);
  </script>
</body>
</html>
