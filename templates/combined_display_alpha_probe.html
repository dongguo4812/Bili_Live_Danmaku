<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>综合展示透明合成测试</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #00ff00 !important;
    }
    #combined-probe-frame {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent !important;
    }
    #combined-probe-label {
      position: fixed;
      z-index: 2147483647;
      left: 8px;
      top: 8px;
      padding: 4px 7px;
      color: #000;
      background: rgba(255,255,255,.85);
      font: 12px/1.4 sans-serif;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="combined-probe-label">综合展示透明测试：Live2D 模型外区域应显示绿色</div>
  <iframe id="combined-probe-frame" title="综合展示透明合成测试"
          allow="autoplay" allowtransparency="true"
          src="{{ combined_url }}"></iframe>
</body>
</html>
