<!doctype html>
<html lang="zh-CN" class="display-root">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live2D OBS Display</title>
  <link rel="stylesheet" href="/static/css/style.css?v=20261102-edge-tts">
</head>
<body class="display-page">
  <canvas id="live2d-canvas" aria-label="Live2D model display"></canvas>

  <section id="danmaku-bubble" class="danmaku-bubble" aria-live="polite" aria-label="直播弹幕" hidden></section>
  <section id="danmaku-preview" class="danmaku-bubble danmaku-preview" aria-hidden="true" hidden></section>

  <button id="display-settings-toggle" class="display-settings-toggle" type="button"
          aria-expanded="false" aria-controls="display-settings-panel">⚙ 设置</button>

  <section id="display-settings-panel" class="display-settings-panel" aria-label="Live2D 展示设置" hidden>
    <header class="display-settings-header">
      <strong>Live2D 展示设置</strong>
      <button id="display-settings-close" class="settings-close" type="button" aria-label="关闭设置">×</button>
    </header>

    <label class="setting-field">
      <span>模型</span>
      <select id="model-select"></select>
    </label>

    <label class="setting-field">
      <span>模型大小 <output id="scale-value">100%</output></span>
      <input id="scale-slider" type="range" min="25" max="150" step="1" value="100">
    </label>

    <label class="setting-field">
      <span>模型水平位置 <output id="x-value">0.00</output></span>
      <input id="x-slider" type="range" min="-100" max="100" step="1" value="0">
    </label>

    <label class="setting-field">
      <span>模型垂直位置 <output id="y-value">0.00</output></span>
      <input id="y-slider" type="range" min="-100" max="100" step="1" value="0">
    </label>

    <div class="settings-divider"></div>
    <strong class="settings-subtitle">弹幕对话框位置与大小</strong>

    <label class="setting-field">
      <span>对话框水平位置 <output id="bubble-x-value">50%</output></span>
      <input id="bubble-x-slider" type="range" min="0" max="100" step="1" value="50">
    </label>

    <label class="setting-field">
      <span>对话框底部位置 <output id="bubble-bottom-value">45%</output></span>
      <input id="bubble-bottom-slider" type="range" min="0" max="95" step="1" value="45">
    </label>

    <label class="setting-field">
      <span>对话框宽度 <output id="bubble-width-value">420px</output></span>
      <input id="bubble-width-slider" type="range" min="240" max="760" step="10" value="420">
    </label>

    <label class="setting-field">
      <span>弹幕字体大小 <output id="bubble-font-value">20px</output></span>
      <input id="bubble-font-slider" type="range" min="12" max="40" step="1" value="20">
    </label>

    <label class="setting-field">
      <span>对话框最大高度 <output id="bubble-height-value">320px</output></span>
      <input id="bubble-height-slider" type="range" min="100" max="700" step="10" value="320">
    </label>

    <label class="setting-field">
      <span>同时显示弹幕条数 <output id="bubble-items-value">5 条</output></span>
      <input id="bubble-items-slider" type="range" min="1" max="12" step="1" value="5">
    </label>

    <label class="setting-field">
      <span>每条弹幕显示时长 <output id="bubble-duration-value">10 秒</output></span>
      <input id="bubble-duration-slider" type="range" min="2" max="60" step="1" value="10">
    </label>

    <div class="settings-divider"></div>
    <strong class="settings-subtitle">Edge TTS 语音播报</strong>

    <div class="tts-switches">
      <label><input id="tts-danmaku-enabled" type="checkbox" checked> 普通弹幕</label>
      <label><input id="tts-gift-enabled" type="checkbox" checked> 礼物</label>
      <label><input id="tts-sc-enabled" type="checkbox" checked> 醒目留言（SC）</label>
    </div>

    <label class="setting-field">
      <span>语音音色</span>
      <select id="tts-voice"></select>
    </label>

    <label class="setting-field">
      <span>语速 <output id="tts-rate-value">0%</output></span>
      <input id="tts-rate-slider" type="range" min="-50" max="100" step="5" value="0">
    </label>

    <label class="setting-field">
      <span>音量 <output id="tts-volume-value">0%</output></span>
      <input id="tts-volume-slider" type="range" min="-50" max="50" step="5" value="0">
    </label>

    <label class="setting-field">
      <span>最大等待语音数量 <output id="tts-queue-value">30 条</output></span>
      <input id="tts-queue-slider" type="range" min="1" max="200" step="1" value="30">
    </label>

    <label class="setting-field">
      <span>礼物最低播报金额（元）</span>
      <input id="tts-gift-min" type="number" min="0" max="100000" step="0.1" value="0">
    </label>

    <div class="tts-actions">
      <button id="tts-test-button" class="secondary-button" type="button">测试语音</button>
      <button id="tts-save-button" class="settings-save-button" type="button">保存语音设置</button>
    </div>
    <p id="tts-status" class="settings-save-status" role="status">首次使用请点击测试语音，允许 OBS 浏览器播放声音并驱动嘴型。</p>

    <div class="settings-footer">
      <p id="settings-save-status" class="settings-save-status" role="status">调整完成后点击保存；保存时会尝试刷新 OBS 浏览器源。</p>
      <button id="settings-save-button" class="settings-save-button" type="button">保存设置</button>
    </div>
  </section>

  <div id="display-placeholder" role="status">正在初始化 Live2D 模型…</div>

  <!-- This bundle exposes the legacy Cubism 2 loadlive2d(canvasId, modelJsonUrl) API. -->
  <script src="/static/js/live2d.min.js?v=20261102-tts-mouth-sync"></script>
  <script src="/static/js/display.js?v=20261102-edge-tts"></script>
</body>
</html>
