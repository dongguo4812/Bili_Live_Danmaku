<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MOC3 iframe Alpha Probe</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #00ff00 !important;
    }
    #probe-viewport {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: transparent !important;
    }
    #probe-viewport.with-clip {
      clip-path: inset(0% 0% 0% 0%);
      -webkit-clip-path: inset(0% 0% 0% 0%);
    }
    #probe-frame {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent !important;
    }
    #probe-label {
      position: fixed;
      z-index: 10;
      left: 8px;
      top: 8px;
      padding: 4px 7px;
      color: #000;
      background: rgba(255,255,255,.8);
      font: 12px/1.4 sans-serif;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="probe-label">MOC3 iframe 透明合成测试：模型外区域应显示绿色</div>
  <div id="probe-viewport">
    <iframe id="probe-frame" title="MOC3 alpha probe" allow="autoplay" allowtransparency="true"
            src="{{ runtime_url }}"></iframe>
  </div>
  <script>
    // Reproduce display.js applyLive2DCrop(): clip the viewport even when all crop values are zero.
    const withClip = new URLSearchParams(window.location.search).get("clip") === "1";
    const viewport = document.getElementById("probe-viewport");
    const label = document.getElementById("probe-label");
    if (withClip) {
      viewport.classList.add("with-clip");
      label.textContent = "MOC3 iframe 测试：已启用 display.js 同款零值 clip-path";
    } else {
      label.textContent = "MOC3 iframe 测试：未启用 clip-path（对照组）";
    }
  </script>
</body>
</html>
