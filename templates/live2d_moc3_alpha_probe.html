<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MOC3 iframe Alpha Probe</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #00ff00 !important;
    }
    #probe-frame {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent !important;
    }
    #probe-label {
      position: fixed;
      z-index: 10;
      left: 8px;
      top: 8px;
      padding: 4px 7px;
      color: #000;
      background: rgba(255,255,255,.8);
      font: 12px/1.4 sans-serif;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="probe-label">MOC3 iframe 透明合成测试：模型外区域应显示绿色</div>
  <iframe id="probe-frame" title="MOC3 alpha probe" allow="autoplay" allowtransparency="true"
          src="{{ runtime_url }}"></iframe>
</body>
</html>
