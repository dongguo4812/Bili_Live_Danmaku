name: Integration checks

on:
  push:
    branches:
      - master
      - integration/unified-control-center
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q .
      - name: Check Live2D display JavaScript syntax
        run: node --check static/js/display.js
      - name: Run core config and credential regression tests
        timeout-minutes: 3
        run: python -u -m unittest discover -s tests -p "test_core.py" -v
      - name: Run video module regression tests
        timeout-minutes: 3
        run: python -u -m unittest discover -s tests -p "test_video_module.py" -v
      - name: Run offline tests
        timeout-minutes: 5
        run: python -u -m unittest discover -s tests -v

  windows-credential-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q .
      - name: Run Windows DPAPI and configuration retirement tests
        timeout-minutes: 5
        run: python -u -m unittest discover -s tests -p "test_core.py" -v
      - name: Run display route and API contract tests
        timeout-minutes: 3
        run: python -u -m unittest discover -s tests -p "test_display_contracts.py" -v
